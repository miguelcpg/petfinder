<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <header class="bg-primary text-white py-3 mb-4 w-100">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="m-0">🐾 PetFinder</h1>
      <a href="#" class="btn btn-outline-light d-flex align-items-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </a>
    </div>
  </header>  

  <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center">

    <div class="card-container mb-4">
      <div class="card-inner" id="cardInner">
        <div class="card-front">
          <img src="/images/bc.jpg" alt="Pet Desaparecido" id="petImage">
        </div>
        <div class="card-back">
          <iframe id="mapFrame" 
            src="https://maps.google.com/maps?q=São%20Paulo&t=&z=13&ie=UTF8&iwloc=&output=embed"
            width="100%" height="100%" frameborder="0" style="border:0;" allowfullscreen="">
          </iframe>
        </div>
      </div>
    </div>

    <div class="description text-center px-3 mb-4">
        <h5 id="petName">Nome: Bolinha</h5>
        <p id="petDescription">
          Raça: Persa | Cor: Cinza | Última vez visto em: Rua das Flores, 123 - Bairro Jardim.
        </p>
    </div>

    <div class="d-flex gap-3 mb-4">
      <a class="btn btn-link p-0 text-decoration-none d-flex align-items-center gap-2">
        <i class="bi bi-chat-left-dots" onclick="chamarAnunciante()"></i>
      </a>
      
      <a href="" target="_blank" class="btn btn-link p-0 text-decoration-none d-flex align-items-center gap-2">
        <i class="bi bi-share-fill" onclick="gerarLink()"></i>
      </a>
    </div>

    <div class="d-flex gap-3 mb-4">
      <button type="button" class="btn btn-warning d-flex align-items-center gap-2" onclick="anteriorPet()">
        <i class="bi bi-arrow-left-circle-fill"></i> Anterior
      </button>
        <button type="button" class="btn btn-primary d-flex align-items-center gap-2" onclick="revelarLocalizacao()">
          <i class="bi bi-geo-alt-fill"></i> Localização
        </button>
        <button type="button" class="btn btn-warning d-flex align-items-center gap-2" onclick="proximoPet()">
          <i class="bi bi-arrow-right-circle-fill"></i> Próximo
        </button>        
    </div>
      

  </main>

  <!-- Footer -->
  <footer class="bg-success text-center text-muted py-3 mt-4 w-100">
    <small class="text-white">© 2025 PetFinder. Todos os direitos reservados.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
